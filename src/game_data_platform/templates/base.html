<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Game Data Viewer
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=16"
    >

    <link
        rel="stylesheet"
        href="/static/dashboard.css?v=16"
    >
</head>

<body>

    <header class="site-header">

        <div class="site-header-inner">

            <a
                class="brand"
                href="/games"
            >
                Game Data Viewer
            </a>


            <nav class="site-nav">

                <a
                    class="site-nav-link
                    {% if request.url.path.startswith('/games') %}
                        is-active
                    {% endif %}
                    "
                    href="/games"
                >
                    Games
                </a>

                <a
                    class="site-nav-link
                    {% if request.url.path.startswith('/patches') %}
                        is-active
                    {% endif %}
                    "
                    href="/patches"
                >
                    Patches
                </a>

            </nav>

        </div>

    </header>


    <main class="page-shell">

        {% block content %}
        {% endblock %}

    </main>


    {% block scripts %}
    {% endblock %}

</body>
</html>
